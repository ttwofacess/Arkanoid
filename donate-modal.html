<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modal Donar — Aislada</title>
    <style>
        /* ── Variables ── */
        :root {
            --bckgrndbdy: #F0F2F5;
            --btnordr:    #6C63FF;
            --btnplus:    #FF6584;
            --wrpprbck:   #FFFFFF;
            --maintxt:    #333333;
            --primary:    #6C63FF;
            --shadow:     0 4px 6px rgba(0,0,0,0.1);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bckgrndbdy: #1A1A2E;
                --wrpprbck:   #1E1E3F;
                --maintxt:    #EAEAEA;
            }
            .modal-content       { color: var(--maintxt); }
            .crypto-info input   { color: var(--maintxt); background-color: var(--bckgrndbdy); }
        }

        /* ── Base ── */
        body {
            background-color: var(--bckgrndbdy);
            font-family: 'Roboto', sans-serif;
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ── Botón que abre la modal ── */
        #donateButton {
            background-color: var(--btnordr);
            color: white;
            padding: 12px 28px;
            font-size: 1.1rem;
            min-width: 120px;
            min-height: 44px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        #donateButton:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 10px rgba(0,0,0,0.15);
        }

        /* ── Modal overlay ── */
        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0; top: 0;
            width: 100%; height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.4);
        }

        /* ── Contenido de la modal ── */
        .modal-content {
            background-color: var(--wrpprbck);
            margin: 15% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
            max-width: 500px;
            border-radius: 15px;
            position: relative;
        }

        /* ── Botón de cierre (×) ── */
        .close-button {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }
        .close-button:hover { color: var(--maintxt); }

        /* ── Opciones cripto ── */
        .crypto-options {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }
        .crypto-option {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .crypto-icon {
            font-size: 2rem;
            width: 40px;
            text-align: center;
        }
        .crypto-info {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }
        .crypto-info input {
            width: 100%;
            box-sizing: border-box;
            background-color: var(--bckgrndbdy);
            border: 2px solid transparent;
            color: var(--maintxt);
            font-family: 'Roboto', sans-serif;
            font-weight: 500;
            padding: 10px 15px;
            border-radius: 10px;
        }
        .copy-button {
            background-color: var(--btnplus);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .copy-button:hover { background-color: #FF85A1; }
    </style>
</head>
<body>

    <!-- Botón para abrir la modal -->
    <button id="donateButton">Donar</button>

    <!-- ── MODAL ── -->
    <div id="donateModal" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <h2>Donar</h2>
            <div class="crypto-options">

                <div class="crypto-option">
                    <div class="crypto-icon">₿</div>
                    <div class="crypto-info">
                        <span class="crypto-name">Bitcoin</span>
                        <input type="text" value="bc1qxz4nxj8rzxzsnwj8u4rq46wy8dnf5h7yvzaqs2" readonly>
                    </div>
                    <button class="copy-button">Copiar</button>
                </div>

                <div class="crypto-option">
                    <div class="crypto-icon">Ł</div>
                    <div class="crypto-info">
                        <span class="crypto-name">Litecoin</span>
                        <input type="text" value="M8snytUjZP13KVTEHA4JCbHfy31Ve2xMr4" readonly>
                    </div>
                    <button class="copy-button">Copiar</button>
                </div>

                <div class="crypto-option">
                    <div class="crypto-icon">$</div>
                    <div class="crypto-info">
                        <span class="crypto-name">USDT (TRC20)</span>
                        <input type="text" value="TYsPkPyHbWN8cPuoDA7DohwhAdXWkVbQHm" readonly>
                    </div>
                    <button class="copy-button">Copiar</button>
                </div>

            </div>
        </div>
    </div>

    <script>
        const donateButton = document.getElementById('donateButton');
        const modal        = document.getElementById('donateModal');
        const closeButton  = document.querySelector('.close-button');

        // Abrir modal
        donateButton.onclick = () => { modal.style.display = 'block'; };

        // Cerrar con el botón ×
        closeButton.onclick = () => { modal.style.display = 'none'; };

        // Cerrar al hacer clic fuera del contenido
        window.onclick = (event) => {
            if (event.target === modal) modal.style.display = 'none';
        };

        // Copiar dirección al portapapeles
        document.querySelectorAll('.copy-button').forEach(button => {
            button.addEventListener('click', (event) => {
                const input = event.target
                    .previousElementSibling   // .crypto-info
                    .querySelector('input');
                input.select();
                document.execCommand('copy');

                const originalText = button.textContent;
                button.textContent = '¡Copiado!';
                setTimeout(() => { button.textContent = originalText; }, 2000);
            });
        });
    </script>
</body>
</html>

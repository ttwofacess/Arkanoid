<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="./assets/ico/favicon.ico" type="image/png" />
    <link rel="stylesheet" href="./css/main.css">
    <title>Arkanoid en JavaScript</title>
  </head>
  <body>
    <div id="highScoreBoard" class="modal" style="display: none">
      <div id="highScoreContent" class="modal-content">
        <h2 data-i18n="highScores"></h2>
        <ul id="scoreList"></ul>
        <button id="closeButton" class="btn" data-i18n="play"></button>
      </div>
    </div>

    <div class="game-logo-wrapper">
      <img src="./assets/img/darkanoid.png" alt="Darkanoid Logo" class="game-logo" />
    </div>

    <button class="btn" id="hallClick" data-i18n="hallOfFame"></button>
    <button class="btn" id="startButton" data-i18n="play"></button>

    <canvas></canvas>

    <!-- DONATE -->
    <button id="donateButton" class="btn" data-i18n="donate"></button>

    <div id="donateModal" class="modal" role="dialog" aria-modal="true">
      <div class="modal-content">
        <span class="close-button">&times;</span>
        <h2 data-i18n="donate"></h2>
        <div class="crypto-options">
          <div class="crypto-option">
            <div class="crypto-icon">₿</div>
            <div class="crypto-info">
              <span class="crypto-name">Bitcoin</span>
              <input type="text" value="bc1qxz4nxj8rzxzsnwj8u4rq46wy8dnf5h7yvzaqs2" readonly>
            </div>
            <button class="copy-button" data-i18n="copy"></button>
          </div>

          <div class="crypto-option">
            <div class="crypto-icon">Ł</div>
            <div class="crypto-info">
              <span class="crypto-name">Litecoin</span>
              <input type="text" value="M8snytUjZP13KVTEHA4JCbHfy31Ve2xMr4" readonly>
            </div>
            <button class="copy-button" data-i18n="copy"></button>
          </div>

          <div class="crypto-option">
            <div class="crypto-icon">$</div>
            <div class="crypto-info">
              <span class="crypto-name">USDT (TRC20)</span>
              <input type="text" value="TYsPkPyHbWN8cPuoDA7DohwhAdXWkVbQHm" readonly>
            </div>
            <button class="copy-button" data-i18n="copy"></button>
          </div>
        </div>
      </div>
    </div>

    <img
      hidden
      id="sprite"
      src="./assets/img/sprite.png"
      alt="Sprite Arkanoid"
    />
    <img
      hidden
      id="bricks"
      src="./assets/img/bricks.png"
      alt="Sprite Bricks Arkanoid"
    />

    <!-- Botones de control -->
    <div class="mobile-controls">
      <button id="leftButton" class="btn">←</button>
      <button id="rightButton" class="btn">→</button>
    </div>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>

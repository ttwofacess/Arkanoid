<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="./assets/ico/favicon.ico" type="image/png" />
    <link rel="stylesheet" href="./css/main.css">
    <title>Arkanoid en JavaScript</title>
  </head>
  <body>
    <div id="highScoreBoard" class="modal" style="display: none">
      <div id="highScoreContent" class="modal-content">
        <h2>Mejores Puntuaciones</h2>
        <ul id="scoreList"></ul>
        <button id="closeButton" class="btn">Jugar</button>
      </div>
    </div>

    <div class="game-logo-wrapper">
      <img src="./assets/img/darkanoid.png" alt="Darkanoid Logo" class="game-logo" />
    </div>

    <button class="btn" id="hallClick">Salon de la fama</button>
    <button class="btn" id="startButton">Jugar</button>

    <canvas></canvas>

    <!-- DONATE -->
    <button id="donateButton" class="btn">Donar</button>

    <div id="donateModal" class="modal" role="dialog" aria-modal="true">
      <div class="modal-content">
        <span class="close-button">&times;</span>
        <h2>Donar</h2>
        <div class="crypto-options">
          <div class="crypto-option">
            <div class="crypto-icon">
              <img src="./assets/icons/crypto/bitcoin.svg" alt="Bitcoin">
            </div>
            <div class="crypto-info">
              <span class="crypto-name">Bitcoin</span>
              <input type="text" value="bc1qxz4nxj8rzxzsnwj8u4rq46wy8dnf5h7yvzaqs2" readonly>
            </div>
            <button class="copy-button">Copiar</button>
          </div>

          <div class="crypto-option">
            <div class="crypto-icon">
              <img src="./assets/icons/crypto/litecoin.svg" alt="Litecoin">
            </div>
            <div class="crypto-info">
              <span class="crypto-name">Litecoin</span>
              <input type="text" value="M8snytUjZP13KVTEHA4JCbHfy31Ve2xMr4" readonly>
            </div>
            <button class="copy-button">Copiar</button>
          </div>

          <div class="crypto-option">
            <div class="crypto-icon">
              <img src="./assets/icons/crypto/usdt.svg" alt="USDT (TRC20)">
            </div>
            <div class="crypto-info">
              <span class="crypto-name">USDT (TRC20)</span>
              <input type="text" value="TYsPkPyHbWN8cPuoDA7DohwhAdXWkVbQHm" readonly>
            </div>
            <button class="copy-button">Copiar</button>
          </div>
        </div>
      </div>
    </div>

    <img
      hidden
      id="sprite"
      src="./assets/img/sprite.png"
      alt="Sprite Arkanoid"
    />
    <img
      hidden
      id="bricks"
      src="./assets/img/bricks.png"
      alt="Sprite Bricks Arkanoid"
    />

    <!-- Botones de control -->
    <!-- <button id="leftButton" class="btn"><-</button>
    <button id="rightButton" class="btn">-></button> -->
    <div class="mobile-controls">
      <button id="leftButton" class="btn">←</button>
      <button id="rightButton" class="btn">→</button>
    </div>

    <script src="./js/modules/GameState.js"></script>
    <script src="./js/modules/BrickManager.js"></script>
    <script src="./js/modules/Renderer.js"></script>
    <script src="./js/modules/Physics.js"></script>
    <script src="./js/modules/HighScoreManager.js"></script>
    <script src="./js/modules/EventManager.js"></script>
    <script src="./js/modules/GameLoop.js"></script>
    <script type="module" src="./js/main.js"></script>
    <!-- <script src="./main.js"></script> -->
  </body>
</html>
